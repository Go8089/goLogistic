spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: go_logistics_backend

  datasource:
    # Use DB_URL if provided; otherwise default to in-memory H2 for local runs
    url: ${DB_URL:jdbc:h2:mem:go_logistics;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 30000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

aws:
  region: ${AWS_REGION:us-east-1}
  access-key: ${AWS_ACCESS_KEY_ID:${AWS_ACCESS_KEY:}}
  secret-key: ${AWS_SECRET_ACCESS_KEY:${AWS_SECRET_KEY:}}
  ses:
    enabled: ${AWS_SES_ENABLED:false}
    from-email: ${AWS_SES_FROM_EMAIL:noreply@example.com}
  sns:
    enabled: ${AWS_SNS_ENABLED:false}
  elasticache:
    enabled: ${AWS_ELASTICACHE_ENABLED:false}
    endpoint: ${AWS_ELASTICACHE_ENDPOINT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    com.goLogistic: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN